name: NEXORA quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-sufficient-length-not-for-production
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DJANGO_MEDIA_BACKEND: local
      GEMINI_ENABLED: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip coverage pip-audit && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q musea store

      - name: Test adaptive frontend policies
        run: node --test tests_js/*.test.mjs

      - name: Validate Django configuration and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run test suite with coverage
        run: |
          coverage run --source=musea,store manage.py test
          coverage report --fail-under=80

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Validate production deployment settings
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: nexora.example
          DJANGO_CSRF_TRUSTED_ORIGINS: https://nexora.example
          DJANGO_CACHE_URL: redis://localhost:6379/1
        run: python manage.py check --deploy
