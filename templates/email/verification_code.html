<!doctype html>
<html lang='{{ language }}'>
<body style='margin:0;background:#f4f6fb;font-family:Arial,sans-serif;color:#111827'>
  <div style='max-width:560px;margin:32px auto;padding:32px;background:#fff;border-radius:20px'>
    <strong style='letter-spacing:.18em'>NEXORA</strong>
    <p style='font-size:17px;line-height:1.6;white-space:pre-line'>{{ message }}</p>
    <p style='margin:28px 0 0'>
      <a href='{{ verification_link }}' style='display:inline-block;padding:14px 22px;border-radius:999px;background:#ff5c35;color:#111;text-decoration:none;font-weight:700'>Verify email</a>
    </p>
  </div>
</body>
</html>
